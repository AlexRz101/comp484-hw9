<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Mini Demo</title>

    <!-- Link to external CSS files -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> JavaScript Mini Demo </h1>
    <main>
        
        <!-- Section 1: Today's Date -->
        <section> 
            <h2> 
                Today is <span id="dateDisplay"></span>
            </h2>
        </section>

    <!-- Section 2: Number Conversion Tests -->
    <section>
        <h2> Number Conversion Tests </h2>
        <table class="conversionTable">
            <tr>
                <th>Original</th>
                <th>Converted</th>
                <th>isNaN</th>
                <th>isInteger</th>
            </tr>
            <tr>
                <td id="original1"></td>
                <td id="converted1"></td>
                <td id="isNaN1"></td>
                <td id="isInteger1"></td>
            </tr>
            <tr>
                <td id="original2"></td>
                <td id="converted2"></td>
                <td id="isNaN2"></td>
                <td id="isInteger2"></td>
            </tr>
            <tr>
                <td id="original3"></td>
                <td id="converted3"></td>
                <td id="isNaN3"></td>
                <td id="isInteger3"></td>
            </tr>
            <tr>
                <td id="original4"></td>
                <td id="converted4"></td>
                <td id="isNaN4"></td>
                <td id="isInteger4"></td>
            </tr>
        </table>
    </section>

<p id="printValidityMessage"></p>

        <!-- Section 3: Math and Number Formatting -->
        <section>
            <h2> Math and Number Formatting </h2>

            <h3> Item Price </h3>
            <p id="printItemPrice"></p>

            <h3> Tax Rate </h3>
            <p id="printTaxRate"></p>

            <h3> Shipping Cost </h3>
            <p id="printShippingCost"></p>

            <h3> Tax Amount </h3>
            <p id="printTaxAmount"></p>

            <h3> Total </h3>
            <p id="printTotal"></p>

            <h3> Shipping Status </h3>
            <p id="printShippingStatus"></p>
        </section>

        <!-- Script -->
        <script src="script.js"></script>
    </main>
</body>
</html>
